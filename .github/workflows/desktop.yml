name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: startsWith(github.ref, 'refs/tags/')
        run: npx tsx scripts/release.mts --check
      - run: npm run check
      - run: npm run desktop:dist -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: MakePace-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.exe
            dist/desktop/*.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: MakePace-*
          path: dist/installers
          merge-multiple: true
      - run: npx tsx scripts/release.mts
        env:
          GH_TOKEN: ${{ github.token }}

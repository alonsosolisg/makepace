          .join(
            '',
          )}<div class="nav-label">RECENT CONVERSATIONS</div><button class="thread active" data-view="chat">The family organizer</button><button class="thread" data-act="thread">Explore calmer hooks</button><button class="thread" data-act="thread">Review last week</button><div class="spacer"></div><button data-view="settings" title="Settings" class="${view === 'settings' ? 'active' : ''}">${icon('settings')}<span>Settings</span></button><small class="nav-label">LOCAL WORKSPACE</small></aside>`;
      }
      function post() {
        return `<div class="post"><small>THE FAMILY ORGANIZER</small><h2>${slide === 0 ? 'Why helping Mom feels like <span class="underline">another job.</span>' : slide === 1 ? '“Let me know” gives her one more thing to figure out.' : '“Can I bring dinner on Tuesday?” is easier to answer.'}</h2><p>${slide === 0 ? 'Sometimes it’s the planning, not the helping, that wears you out.' : 'Make the offer specific. Leave room for her to say no.'}</p><footer>HEY MOM APP</footer></div>`;
      }
      function artifact() {
        return `<div class="artifact"><div class="artifact-head">${icon('stack')}<div><strong>The family organizer</strong><small>6 posts · 3 formats · version 2</small></div><span class="count">${approved ? 'Approved' : 'Ready to review'}</span></div><div class="mini-grid">${hooks.map((h, i) => `<button class="mini" data-post="${i}"><small>0${i + 1} / FIRST SLIDE</small>${h}</button>`).join('')}</div><div class="artifact-footer">Source references attached <button data-act="review">Open batch ${icon('arrow')}</button></div></div>`;
      }
      function chat() {
        return `<section class="chat ${[2, 5].includes(option) ? 'canvas-chat' : ''}"><header class="chat-head"><div><h3>The family organizer</h3><small>Hey Mom / October content experiment</small></div><button title="Conversation files" data-act="files">${icon('folder')}</button></header><div class="chat-scroll" id="conversation"><div class="user">Let’s make six posts for the person in the family who ends up organizing everything. Keep the language simple and give each one a different angle.</div><div class="response"><div class="runline">${icon('check')} Read workspace knowledge <span>·</span> Applied 2 workflows</div><span class="recipe-chip">${icon('stack')} Produce a batch · v1.0</span><p>I’ve centered the batch on the invisible work: remembering, coordinating, and following up.</p><p>Three angles: <b>making a specific offer</b>, <b>sharing the plan</b>, and <b>leaving room for independence</b>. Each post starts with a moment an adult child would recognize.</p><button class="evidence" data-view="research">${icon('search')} 4 reference posts · 3 visual recipes <span>↗</span></button>${option === 3 ? '<div class="run-summary"><div><b>6</b>posts drafted</div><div><b>3</b>formats tested</div><div><b>2</b>details to check</div></div>' : ''}${artifact()}<p>The opening slide is selected. Want to tighten the hook, change the image, or review the full sequence?</p></div></div><form class="composer" id="composer"><textarea aria-label="Message" placeholder="Make the first hook more specific…"></textarea><div class="composer-bottom"><button type="button" data-view="workflows">${icon('plus')} Workflow</button><span>GPT-6.1 Sol</span><span>·</span><span>Auto effort</span><button class="send" title="Send demo message" aria-label="Send demo message">${icon('up')}</button></div></form></section>`;
      }
      function panel(stage = false) {
        return `<aside class="${stage ? 'stage-preview' : 'panel'}"><div class="panel-head"><b>Post 01 <span class="muted">/ 06</span></b><button data-act="review" title="Inspect post">${icon('grid')}</button></div>${post()}${stage ? '<div class="filmstrip">' + [0, 1, 2, 3, 4].map((i) => `<button data-slide="${i % 3}" class="${slide === i ? 'selected' : ''}">0${i + 1}</button>`).join('') + '</div>' : '<div class="slide-dots"><i></i><i></i><i></i><i></i><i></i></div>'}<div class="review-actions"><button class="primary" data-act="approve">${approved ? 'Approved ✓' : 'Approve post'}</button><button class="secondary" data-act="revise">Request edit</button></div><p class="panel-note">TikTok · 1080 × 1440<br>Approval applies to this version. Publishing is a separate step.</p></aside>`;
      }
      function board() {
        return `<div class="board"><div class="panel-head"><b>Batch canvas <span class="muted">/ 6 posts</span></b><span class="pill">Draft v2</span></div><div class="board-grid">${[...hooks, ...hooks].map((h, i) => `<button class="board-tile ${i === 0 ? 'selected' : ''}" data-post="${i % 3}"><div class="mini" style="background:${['#E2EFEB', '#EEE9DD', '#284942'][i % 3]};color:${i % 3 === 2 ? '#FCF7EB' : '#24524B'}"><small>HEY MOM APP</small>${h}</div><p>0${i + 1} · ${['Explainer', 'Message swaps', 'Personal essay'][i % 3]}</p><small>${i === 0 && approved ? 'Approved' : 'Ready to review'}</small></button>`).join('')}</div></div>`;
      }
      function threads() {
        return `<aside class="threads"><h3>Conversations <span class="inbox-count">3</span></h3>${[
          ['The family organizer', '6 posts ready to review', 'Now'],
          ['Explore calmer hooks', '3 angles selected', 'Yesterday'],
          ['Review last week', 'Results → new experiment', 'Monday'],
        ]
          .map(
            (t, i) =>
              `<button class="thread-item ${!i ? 'active' : ''}" data-act="${i ? 'thread' : 'current'}"><strong>${t[0]}</strong><p>${t[1]}</p><small>${t[2]}</small></button>`,
          )
          .join(
            '',
          )}<div class="notice">A conversation can contain research, posts, revisions, and a publishing plan.</div></aside>`;
      }
      function heading(title, description, action = '') {
        return `<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div>${action}</div>`;
      }
      function settings() {
        return (
          heading('Settings', 'Your workspace, tools, and publishing preferences.') +
          `<div class="tabs">${['Connections', 'Workspace', 'Agent', 'Publishing'].map((t) => `<button data-tab="${t}" class="${settingsTab === t ? 'active' : ''}">${t}</button>`).join('')}</div>` +
          (settingsTab === 'Connections'
            ? `<div class="settings-grid">${[
                [
                  'Codex',
                  'C',
                  'Local agent',
                  'Uses your local Codex login. Model and speed are chosen per conversation.',
                ],
                [
                  'OneUp',
                  '↑',
                  'Publishing',
                  'Connect your publishing account, then choose which social profiles belong to this workspace.',
                ],
                [
                  'Apify',
                  'A',
                  'Public-data research',
                  'Collect public TikTok and Instagram posts through configured Actors, with a spend limit per run.',
                ],
                [
                  'Manual sources',
                  '↗',
                  'No account required',
                  'Paste post URLs, import an analytics CSV, or attach reference screenshots.',
                ],
              ]
                .map(
                  ([name, letter, type, desc]) =>
                    `<article class="integration"><div class="service"><div class="service-icon">${letter}</div><div><h3>${name}</h3><small>${type}</small></div></div><p>${desc}</p><footer><span class="${connected[name] ? 'status' : 'muted'}">${connected[name] ? '<i class="dot"></i> Connected · demo' : 'Not connected'}</span><button class="secondary" data-integration="${name}">${connected[name] ? 'Manage' : name === 'Manual sources' ? 'Import sources' : 'Connect'}</button></footer></article>`,
                )
                .join(
                  '',
                )}</div><div class="notice">Connection status shown here is illustrative. These concepts never store a token or contact a publishing service.</div>`
            : settingsTab === 'Agent'
              ? `${row('Provider', 'Codex · connected locally', '<span class="pill">GPT-6.1 Sol</span>')}${row('Reasoning', 'MakePace chooses effort for the task; Astra stays at medium or below.', '<span class="pill">Automatic</span>')}${row('Fast mode', 'Use the faster service tier when available.', '<button class="toggle off" data-act="toggle" aria-label="Toggle Fast mode"><i></i></button>')}${row('External actions', 'Ask before publishing or sending messages.', '<span class="pill">Approval required</span>')}`
              : settingsTab === 'Publishing'
                ? `${row('Timezone', 'Used for previews and OneUp scheduling.', '<span class="pill">Europe / Tallinn</span>')}${row('Posting range', 'Apply alongside the existing queue, per platform.', '<span class="pill">3–4 / day</span>')}${row('Vary posting times', 'Avoid identical daily slots; this does not promise reach.', '<button class="toggle" data-act="toggle" aria-label="Vary posting times"><i></i></button>')}${row('Review before scheduling', 'Only approved asset versions can be scheduled.', '<span class="pill">Always</span>')}`
                : `${row('Workspace', 'Hey Mom · appheymom.com', '<button class="secondary" data-act="knowledge">Review knowledge</button>')}${row('Audience', 'Adult children who became the family’s default organizer.', '<button class="secondary" data-act="knowledge">Edit</button>')}${row('Brand', 'Porcelain, turquoise, approved app icon.', '<button class="secondary" data-act="knowledge">View assets</button>')}${row('Local files', 'Brief, source evidence, content, and version history.', '<button class="secondary" data-act="files">Open folder</button>')}`)
        );
      }
      function row(name, desc, control) {
        return `<div class="setting-row"><div><b>${name}</b><p>${desc}</p></div>${control}</div>`;
      }
      function page() {
        if (view === 'settings') return settings();
        if (view === 'workflows')
          return (
            heading(
              'Workflows',
              'Repeatable methods. Adapted to the workspace you’re in.',
              '<button class="secondary" data-act="workflow-info">How adaptation works ↗</button>',
            ) +
            `<div class="workflow-grid">${workflows.map(([i, n, d, o], x) => `<button class="workflow" data-workflow="${x}">${icon(i)}<h3>${n}</h3><p>${d}</p><footer><span>${o}</span><span>v1.0 ↗</span></footer></button>`).join('')}</div>`
          );
        if (view === 'research')
          return (
            heading(
              'Research',
              'Keep the evidence that makes a format worth testing.',
              '<button class="primary" data-integration="Apify">Collect references</button>',
            ) +
            `<div class="notice">Sample library, not performance claims. Store source URLs, collection dates, and observed metrics with each reference.</div><div class="source-grid">${hooks.map((h, i) => `<article class="source"><button class="mini" data-post="${i}">${['Why / how explainer', 'Seven useful swaps', 'Two-page personal essay'][i]}</button><p><b>${['Explanatory hook', 'A concrete alternative', 'Recognition → reflection'][i]}</b></p><small>Reference recipe · audience fit to verify</small><button class="evidence" data-act="reference">Inspect evidence ↗</button></article>`).join('')}</div>`
          );
        if (view === 'library')
          return (
            heading(
              'Content',
              'Every draft, revision, and approved version in one place.',
              '<button class="primary" data-view="chat">Continue in conversation</button>',
            ) + board()
          );
        if (view === 'queue')
          return (
            heading(
              'Publishing',
              'Review the plan before anything leaves MakePace.',
              '<button class="primary" data-act="schedule">Review schedule</button>',
            ) +
            `<div class="notice">Proposed slots · sample data · nothing scheduled. Connect OneUp to choose the destination accounts.</div><div class="queue">${['Monday', 'Tuesday', 'Wednesday', 'Thursday'].map((day, i) => `<div class="day"><h3>${day}</h3>${[0, 1, 2].map((n) => `<div class="queued"><small>${['11:17', '15:43', '19:26'][n]} · TikTok</small>${hooks[(i + n) % 3]}<small>Awaiting approval</small></div>`).join('')}</div>`).join('')}</div>`
          );
        return (
          heading('Results', 'Learn what to repeat, and what to test next.') +
          `<div class="notice">No live metrics in this concept. Connect sources or import your account export to populate this view.</div><div class="run-summary"><div><b>—</b>views at 72 hours</div><div><b>—</b>likes / views</div><div><b>—</b>comments / views</div></div>${row('Format leaderboard', 'Compare formats at the same post age, with sample sizes shown.', '<span class="pill">Awaiting data</span>')}${row('Angle performance', 'Separate the story angle from its visual format.', '<span class="pill">Awaiting data</span>')}${row('Comment analysis', 'What people actually responded to, with source examples.', '<button class="secondary" data-integration="Apify">Add data</button>')}`
        );
      }
      function render() {
        document.querySelector('#options').innerHTML = designs
          .map(
            (d, i) =>
              `<button class="option ${option === i + 1 ? 'active' : ''}" data-option="${i + 1}"><span>0${i + 1}</span><b>${d[0]}</b></button>`,
          )
          .join('');
        document.querySelector('#rationale').innerHTML =
          `<b>${designs[option - 1][1]}</b> ${designs[option - 1][2]}`;
        let center;
        if (view !== 'chat') center = `<div class="view-page">${page()}</div>`;
        else if (option === 1) center = chat() + panel();
        else if (option === 2) center = chat() + board();
        else if (option === 3)
          center = `<div class="stage-main"><div class="stagebar"><b>✓ Research</b><i></i><b>✓ Plan</b><i></i><b>✓ Produce</b><i></i><b>04 Review</b><i></i><span>05 Schedule</span></div>${chat()}</div>`;
        else if (option === 4) center = threads() + chat();
        else center = chat() + panel(true);
        document.querySelector('#app').innerHTML =
          `<section class="app option-${option}"><div class="titlebar"><div class="wordmark">${logo}MakePace</div><span class="breadcrumb">Hey Mom / ${view === 'chat' ? 'The family organizer' : view}</span><div class="right"><span class="status"><i class="dot"></i> Codex connected</span><span class="pill">Local</span><span class="window">− □ ×</span></div></div><div class="body">${nav()}<main class="main">${center}</main></div></section>`;
        const form = document.querySelector('#composer');
        if (form) form.onsubmit = send;
        history.replaceState(null, '', '#' + option + '/' + view);
      }
      function modal(title, body) {
        document.querySelector('#overlay').innerHTML =
          `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><h2>${title}</h2><button data-act="close" aria-label="Close dialog">${icon('close')}</button></div>${body}</section></div>`;
        document.querySelector('.modal button')?.focus();
      }
      function toast(text) {
        const el = document.querySelector('#toast');
        el.className = 'toast';
        el.hidden = false;
        el.textContent = text;
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => (el.hidden = true), 3500);
      }
      function integration(name) {
        if (name === 'Manual sources') {
          modal(
            'Bring your own references',
            '<p>Start without a scraper: paste public post links, attach reference screenshots, or import your own analytics export.</p><label>Reference URL</label><input class="mock-input" readonly value="https://www.tiktok.com/@example/video/…"><button class="primary" data-act="import-demo">Add sample reference</button><p>Manual research is supported as a workflow. Automated scraping is optional, not an onboarding requirement.</p>',
          );
          return;
        }
        modal(
          `${name} connection`,
          name === 'Codex'
            ? '<p>Uses the local Codex app server and the account signed in on this computer.</p><div class="notice">Connected · demo state<br>Model: GPT-6.1 Sol · task-based effort</div><button class="secondary" data-act="close">Done</button>'
            : `<p>${name === 'OneUp' ? 'Add your API key, verify the connection, then map your TikTok and Instagram accounts to this workspace.' : 'Add an API token and choose maintained TikTok / Instagram Actors. Check their fields and costs before collection.'}</p><label>${name === 'OneUp' ? 'API key' : 'API token'} · prototype field</label><input class="mock-input" readonly value="Not collected in this prototype"><div class="notice">${name === 'OneUp' ? 'Next: choose social accounts → set timezone → confirm a schedule.' : 'Next: configure Actors → set a spend cap → inspect a sample dataset. Missing metrics stay unavailable, never zero.'}</div><button class="primary" data-connect="${name}">Simulate successful connection</button>`,
        );
      }
      function send(event) {
        event.preventDefault();
        const input = event.target.querySelector('textarea');
        if (!input.value.trim()) return;
        const box = document.querySelector('#conversation');
        const user = document.createElement('div');
        user.className = 'user';
        user.textContent = input.value;
        const reply = document.createElement('div');
        reply.className = 'response inline-reply';
        reply.innerHTML =
          '<div class="runline">Interface demo · no model request sent</div><p>A revision would appear here, with the updated artifact beside the conversation and the previous version kept for comparison.</p>';
        box.append(user, reply);
        input.value = '';
        box.scrollTop = box.scrollHeight;
      }
      document.addEventListener('click', (event) => {
        const el = event.target.closest('button,a');
        if (!el) return;
        if (el.id === 'notes-link') {
          event.preventDefault();
          modal(
            'The system behind the screens',
            '<p><b>Workflows are the reusable method.</b> Each combines a versioned base skill with workspace knowledge, a visual recipe, a task brief, and review criteria. Hey Mom’s audience, claims, CTA, and cadence belong to its workspace—not the global skill.</p><p><b>OneUp</b> provides scheduling and account APIs. <b>Apify</b> provides configurable collection runs and datasets. Both need real adapters and secret storage before production.</p><p><b>Without Apify:</b> start with links, screenshots, browser inspection, and account exports. TikTok Research API is not available to commercial users; it is not a general substitute for niche research.</p><p><a href="https://www.oneupapp.io/api-features" target="_blank" rel="noreferrer">OneUp API</a> · <a href="https://docs.apify.com/get-started" target="_blank" rel="noreferrer">Apify</a> · <a href="https://developers.tiktok.com/docs/en/research-api-faq" target="_blank" rel="noreferrer">TikTok eligibility</a></p>',
          );
          return;
        }
        if (el.dataset.option) {
          option = +el.dataset.option;
          render();
          return;
        }
        if (el.dataset.view) {
          view = el.dataset.view;
          render();
          return;
        }
        if (el.dataset.tab) {
          settingsTab = el.dataset.tab;
          render();
          return;
        }
        if (el.dataset.integration) {
          integration(el.dataset.integration);
          return;
        }
        if (el.dataset.connect) {
          connected[el.dataset.connect] = true;
          document.querySelector('#overlay').innerHTML = '';
          view = 'settings';
          render();
          toast('Demo connection saved for this preview only.');
          return;
        }
        if (el.dataset.workflow !== undefined) {
          const w = workflows[+el.dataset.workflow];
          modal(
            w[1],
            `<p>${w[2]}</p><div class="notice">BASE WORKFLOW v1.0 + HEY MOM WORKSPACE</div><ul><li>Audience: the adult child coordinating family help.</li><li>Use verified product claims and approved brand assets.</li><li>Keep source evidence, recipe version, and exact asset approval.</li><li>Return a reviewable result before external actions.</li></ul><p>Inputs: ${w[3].split(' → ')[0]}<br>Output: ${w[3].split(' → ')[1]}</p><button class="primary" data-act="use-workflow">Use in a conversation</button>`,
          );
          return;
        }
        if (el.dataset.post !== undefined) {
          slide = +el.dataset.post;
          modal(
            'Post review',
            post() +
              '<div class="review-actions"><button class="primary" data-act="approve">Approve this version</button><button class="secondary" data-act="revise">Request edit</button></div>',
          );
          return;
        }
        if (el.dataset.slide !== undefined) {
          slide = +el.dataset.slide;
          render();
          return;
        }
        const a = el.dataset.act;
        if (a === 'close') document.querySelector('#overlay').innerHTML = '';
        else if (a === 'approve') {
          approved = true;
          document.querySelector('#overlay').innerHTML = '';
          render();
          toast('Post 01 approved in this demo. Nothing published.');
        } else if (a === 'review') {
          modal(
            'Review the batch',
            artifact() +
              '<p>Select a first slide to inspect the post. Approval is per asset version.</p>',
          );
        } else if (a === 'revise') {
          document.querySelector('#overlay').innerHTML = '';
          view = 'chat';
          render();
          const input = document.querySelector('textarea');
          input.value = 'Make the opening more specific to the person organizing the family.';
          input.focus();
        } else if (a === 'new' || a === 'use-workflow') {
          document.querySelector('#overlay').innerHTML = '';
          view = 'chat';
          render();
          document.querySelector('textarea').value =
            a === 'new' ? '' : 'Use this workflow with our saved audience and brand knowledge.';
          document.querySelector('textarea').focus();
        } else if (a === 'schedule') {
          modal(
            'Review before scheduling',
            '<p>This batch has proposed slots, but it has not been sent to OneUp.</p><ul><li>Confirm destination accounts and timezone.</li><li>Check approved versions, music, and disclosure settings.</li><li>Count existing posts against the daily range.</li><li>Approve the exact schedule.</li></ul><button class="primary" data-integration="OneUp">Set up OneUp</button>',
          );
        } else if (a === 'toggle') {
          el.classList.toggle('off');
        } else if (a === 'files') {
          modal(
            'Workspace files',
            '<p>Your local workspace keeps the brief, collected evidence, editable content, and exact reviewed exports together.</p><div class="notice">workspace-knowledge.json<br>research / sources<br>formats / recipes<br>batches / family-organizer / v2<br>publishing / schedule-draft.json</div>',
          );
        } else if (a === 'workflow-info') {
          modal(
            'A method, not a brand template',
            '<p>Standard workflows retain the production discipline from your existing skills: source inspection, concrete hooks, image continuity, faithful product screens, crop QA, approvals, and comparable results.</p><p>Each workspace supplies its own audience, offer, proof, voice, visuals, CTA, accounts, and cadence. No Hey Mom-specific copy is hardcoded into the base method.</p>',
          );
        } else if (a === 'reference') {
          modal(
            'Source evidence',
            '<p>A reference includes the original link, capture date, public metrics with denominators, and the visual/story mechanism worth testing.</p><div class="notice">Sample only. No invented viral counts or unverified winner labels.</div>',
          );
        } else if (a === 'knowledge') {
          modal(
            'Workspace knowledge',
            '<p><b>Audience:</b> Adult children who became the family’s default organizer.</p><p><b>Offer:</b> Shared family plans and easier follow-through.</p><p><b>Copy:</b> Concrete situations, plain language, and an earned payoff. Product claims must match verified behavior.</p>',
          );
        } else if (a === 'import-demo') {
          document.querySelector('#overlay').innerHTML = '';
          view = 'research';
          render();
          toast('Sample reference added to the demo library.');
        } else if (a === 'thread') {
          toast('This concept uses one complete sample conversation.');
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') document.querySelector('#overlay').innerHTML = '';
      });
      const initial = location.hash.match(/^#([1-5])\/(\w+)$/);
      if (initial) {
        option = +initial[1];
        if (
          ['chat', 'research', 'library', 'workflows', 'queue', 'results', 'settings'].includes(
            initial[2],
          )
        )
          view = initial[2];
      }
      render();
    </script>
  </body>
</html>
